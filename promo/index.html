<script>
'use strict';
// ───────────────────────── time, springs, tracks ─────────────────────────
const T = 14, BEAT = 0.5;
const mod = (t, m = T) => ((t % m) + m) % m;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;

// closed-form step response of a damped spring (0 → 1). resp = period in s, z = damping ratio
function S(t, resp = 0.42, z = 0.86) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI / resp;
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  }
  return 1 - Math.exp(-w * t) * (1 + w * t);
}
// A value that changes target many times = sum of one spring per change.
// Periodic: the previous cycle's tail is included, so f(0) === f(T) and velocities match.
function track(keys, def = {}) {
  const ks = keys.slice().sort((a, b) => a.t - b.t);
  const vLast = ks[ks.length - 1].v;
  const ds = ks.map((k, i) => ({ t: k.t, d: k.v - (i ? ks[i - 1].v : vLast),
    resp: k.resp ?? def.resp ?? 0.42, z: k.z ?? def.z ?? 0.86 })).filter(k => k.d !== 0);
  return t => {
    t = mod(t);
    let v = vLast;
    for (const k of ds) v += k.d * (S(t - k.t + T, k.resp, k.z) + S(t - k.t, k.resp, k.z));
    return v;
  };
}
// one-shot sequence (no wrap): v0 then a spring per key
function seq(v0, keys) {
  const ds = keys.map((k, i) => ({ t: k.t, d: k.v - (i ? keys[i - 1].v : v0), resp: k.resp, z: k.z ?? 0.92 }));
  return t => { let v = v0; for (const k of ds) v += k.d * S(t - k.t, k.resp, k.z); return v; };
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function colorTrack(keys, def) {
  const ch = [0, 1, 2].map(c => track(keys.map(k => ({ ...k, v: hex(k.v)[c] })), def));
  return t => `rgb(${ch.map(f => Math.round(clamp(f(t), 0, 255))).join(',')})`;
}
// enter/exit envelope of an interval [a, b) on the loop
function env(t, a, b, o = {}) {
  const din = o.din ?? 0.035, rin = o.rin ?? 0.26, rout = o.rout ?? 0.14;
  let best = { op: 0, en: 0, ex: 1 };
  for (const k of [-1, 0, 1]) {
    const en = S(t - a - din - k * T, rin, 1), ex = S(t - b - k * T, rout, 1);
    const op = en * (1 - ex);
    if (op > best.op || (best.op === 0 && en > 0 && ex < 1)) best = { op, en, ex };
  }
  return best;
}
// a click: smooth press pulse centred on the beat
const PRESS = [];
function press(t, list = PRESS, w = 0.055) {
  let p = 0;
  for (const c of list) { const d = Math.min(Math.abs(mod(t - c)), Math.abs(mod(c - t))); p = Math.max(p, Math.exp(-((d / w) ** 2))); }
  return p;
}
// smooth monotone cubic Hermite for the drag path
function hermite(t, pts) {
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const [t0, x0, v0] = pts[i], [t1, x1, v1] = pts[i + 1];
    if (t <= t1) {
      const h = t1 - t0, u = (t - t0) / h, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * x0 + (u3 - 2 * u2 + u) * h * v0 + (-2 * u3 + 3 * u2) * x1 + (u3 - u2) * h * v1;
    }
  }
  return pts[pts.length - 1][1];
}
const rubber = (x, d = 120, c = 0.55) => (1 - 1 / (x * c / d + 1)) * d;

// ───────────────────────── layers (each state's content) ─────────────────────────
const $ = s => document.querySelector(s);
const layersEl = $('#layers');
const LAYERS = [];
function layer(id, a, b, w, h, html, o = {}) {
  const el = document.createElement('div');
  el.className = 'layer'; el.id = id;
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.left = -w / 2 + 'px'; el.style.top = -h / 2 + 'px';
  el.innerHTML = html;
  layersEl.appendChild(el);
  const L = { id, a, b, w, h, el, anchor: o.anchor || 'center', dy: o.dy || 0, o };
  LAYERS.push(L);
  return L;
}

// ───────────────────────── timeline: states of the one shape ─────────────────────────
const STATES = [
  [13.0, 'login', BLUE], [0.0, 'field', WHITE], [1.0, 'card', WHITE], [1.5, 'login', BLUE],
  [2.0, 'loader', BLUE], [3.0, 'island', INK], [3.5, 'course', WHITE], [4.0, 'sem', WHITE],
  [6.0, 'toggle', WHITE], [6.5, 'toggle', INK], [7.0, 'tabs', INK], [8.5, 'tt', INK],
  [10.0, 'pill', WHITE], [10.5, 'pal', WHITE], [11.0, 'pal1', WHITE], [12.0, 'toast', INK], [12.5, 'toast2', INK],
];
const camScale = g => Math.min(2.2, 1300 / g.w, 1240 / g.h);
let F = {}; // all tracks, built after measuring

function build() {
  // measure real text widths for the tab bar and the ⌘K button
  for (const L of LAYERS) { L.el.style.display = 'block'; }
  const tabs = [...document.querySelectorAll('.tab')].map(e => ({ x: e.offsetLeft + 14, w: e.offsetWidth }));
  G.tabs.w = Math.round(tabs[tabs.length - 1].x + tabs[tabs.length - 1].w + 14);
  const tabsL = LAYERS.find(l => l.id === 'lTabs'); tabsL.w = G.tabs.w;
  tabsL.el.style.width = G.tabs.w + 'px'; tabsL.el.style.left = -G.tabs.w / 2 + 'px';
  const kbd = $('#kbd'), pr = $('#pillRow');
  const kb = { x: kbd.offsetLeft - 220, w: kbd.offsetWidth };
  for (const L of LAYERS) { L.el.style.display = 'none'; }
  F.tabX = tabs.map(t => ({ l: t.x - G.tabs.w / 2, r: t.x + t.w - G.tabs.w / 2 }));
  F.kbd = kb;

  const spr = { resp: 0.42, z: 0.84 };
  const key = (fn) => STATES.map(([t, g, col]) => ({ t, v: fn(G[g], col, g) }));
  F.w = track(key(g => g.w), spr); F.h = track(key(g => g.h), spr); F.r = track(key(g => g.r), spr);
  F.bg = colorTrack(key((g, c) => c), { resp: 0.2, z: 1 });
  F.cam = track(key(g => camScale(g)), { resp: 0.6, z: 1 });

  // ── semester progress (drag) ──
  const BX0 = -360, BX1 = 360, BY = 40;           // bar in sem-card coords
  F.BX0 = BX0; F.BX1 = BX1; F.BY = BY;
  const KX = v => BX0 + (BX1 - BX0) * v / 100;
  const GRAB = 4.5, REL = 5.5, X37 = KX(37);
  const GO = 4; // cursor tip sits 4px right of the knob centre
  const dragPts = [[GRAB, X37 + GO, 0], [5.0, BX1 + GO, 640], [5.3, BX1 + 80, 0], [REL, BX1 + 80, 0]];
  F.dragX = t => hermite(t, dragPts);
  const relX = F.dragX(REL);
  F.relKnob = relX - GO;
  F.prog = t => { // returns {v: percent, s: rubber stretch}
    if (t < GRAB || t >= 6.2) return { v: 37, s: 0 };
    if (t < REL) { const x = F.dragX(t) - GO; return { v: clamp((x - BX0) / (BX1 - BX0)) * 100, s: rubber(Math.max(0, x - BX1)) }; }
    const k = S(t - REL, 0.48, 0.9);
    return { v: lerp(100, 37, k), s: rubber(F.relKnob - BX1) * (1 - k) };
  };

  // ── knob: scrubber → toggle knob → tab indicator → today marker → ⌘K key → selection → toast badge ──
  const tt = { l: -G.tt.w / 2, t: -G.tt.h / 2 };
  const today = { l: tt.l + cellX(1) + 30, r: tt.l + cellX(1) + TT.colW - 30, y: tt.t + TT.top + TT.headH + TT.dayH / 2 };
  const palRowY = (h, i) => -h / 2 + 105 + i * 84 + 40;
  const K = [ // t, xl, xr, yc, h, r, color, op, snap
    [3.9, X37 - 18, X37 + 18, BY, 36, 18, INK, 0, true],
    [6.0, 204 - 26, 204 + 26, 0, 52, 26, WHITE, 1],
    [6.5, 252 - 26, 252 + 26, 0, 52, 26, WHITE, 1],
    [7.0, F.tabX[0].l, F.tabX[0].r, 0, 80, 40, BLUE, 1],
    [7.5, F.tabX[2].l, F.tabX[2].r, 0, 80, 40, BLUE, 1],
    [8.0, F.tabX[1].l, F.tabX[1].r, 0, 80, 40, BLUE, 1],
    [8.5, today.l, today.r, today.y, 44, 22, BLUE, 1],
    [10.0, kb.x, kb.x + kb.w, 0, 44, 12, '#EFEFF1', 1],
    [10.5, -374, 374, palRowY(G.pal.h, 0), 80, 18, BLUE, 1],
    [11.0, -374, 374, palRowY(G.pal1.h, 0), 80, 18, BLUE, 1],
    [12.0, -320 + 32, -320 + 32 + 64, 0, 64, 32, BLUE, 1],
    [13.0, -160, 160, 0, 96, 48, BLUE, 0],
  ];
  const fast = { resp: 0.24, z: 0.86 }, slow = { resp: 0.46, z: 0.86 };
  const xl = [], xr = [];
  const SNAP = { resp: 0.01, z: 1 };
  K.forEach((k, i) => {
    if (k[8]) { xl.push({ t: k[0], v: k[1], ...SNAP }); xr.push({ t: k[0], v: k[2], ...SNAP }); return; }
    const p = K[(i + K.length - 1) % K.length];
    const dir = Math.sign((k[1] + k[2]) - (p[1] + p[2]));
    const moving = Math.abs((k[1] + k[2]) - (p[1] + p[2])) > 1 && Math.abs((k[2] - k[1]) - (p[2] - p[1])) < 140;
    xl.push({ t: k[0], v: k[1], ...(moving ? (dir < 0 ? fast : slow) : {}) });
    xr.push({ t: k[0], v: k[2], ...(moving ? (dir > 0 ? fast : slow) : {}) });
  });
  F.kxl = track(xl); F.kxr = track(xr);
  const sn = k => k[8] ? SNAP : {};
  F.ky = track(K.map(k => ({ t: k[0], v: k[3], ...sn(k) })));
  F.kh = track(K.map(k => ({ t: k[0], v: k[4], ...sn(k) })));
  F.kr = track(K.map(k => ({ t: k[0], v: k[5], ...sn(k) })));
  F.kc = colorTrack(K.map(k => ({ t: k[0], v: k[6], ...sn(k) })), { resp: 0.3, z: 1 });
  F.kop = track([{ t: 4.0, v: 0 }, { t: 4.06, v: 1, resp: 0.3, z: 1 }, { t: 13.12, v: 0, resp: 0.25, z: 1 }]);
  F.X37 = X37;

  // ── track: progress bar → switch track → dissolves into the tab bar ──
  F.tl = track([{ t: 4.0, v: BX0 }, { t: 6.0, v: 228 - 56 }, { t: 7.0, v: -G.tabs.w / 2 }, { t: 7.4, v: BX0, resp: 0.01 }]);
  F.tr = track([{ t: 4.0, v: BX1 }, { t: 6.0, v: 228 + 56 }, { t: 7.0, v: G.tabs.w / 2 }, { t: 7.4, v: BX1, resp: 0.01 }]);
  F.th = track([{ t: 4.0, v: 12 }, { t: 6.0, v: 64 }, { t: 7.0, v: G.tabs.h }, { t: 7.4, v: 12, resp: 0.01 }]);
  F.ty = track([{ t: 4.0, v: BY }, { t: 6.0, v: 0 }, { t: 7.4, v: BY, resp: 0.01 }]);
  F.tc = colorTrack([{ t: 4.0, v: '#E7E5E4' }, { t: 6.0, v: '#E4E4E7' }, { t: 6.5, v: BLUE }, { t: 7.0, v: INK }, { t: 7.4, v: '#E7E5E4', resp: 0.01 }], { resp: 0.28, z: 1 });
  F.top = track([{ t: 4.0, v: 0 }, { t: 4.06, v: 1, resp: 0.3, z: 1 }, { t: 7.0, v: 0, resp: 0.3, z: 1 }]);
  F.fop = track([{ t: 4.0, v: 1, resp: 0.01 }, { t: 6.0, v: 0, resp: 0.18, z: 1 }]);

  // ── badge: «Перейти до курсу» button → clock of «Графік навчального процесу» → theme icon ──
  const B = [[3.4, -262, 142, 76, true], [3.5, -262, 142, 76], [4.0, -372, -175 + 52, 60], [6.0, -330 + 64, 0, 60], [7.0, -G.tabs.w / 2 + 60, 0, 30]];
  const bsn = b => b[4] ? { resp: 0.01, z: 1 } : {};
  F.bx = track(B.map(b => ({ t: b[0], v: b[1], ...bsn(b) }))); F.by = track(B.map(b => ({ t: b[0], v: b[2], ...bsn(b) })));
  F.bs = track(B.map(b => ({ t: b[0], v: b[3], ...bsn(b) })));
  F.bop = track([{ t: 3.5, v: 0 }, { t: 3.57, v: 1, resp: 0.3, z: 1 }, { t: 7.0, v: 0, resp: 0.2, z: 1 }]);
  F.bbg = colorTrack([{ t: 3.5, v: INK }, { t: 6.5, v: WHITE }, { t: 7.4, v: INK, resp: 0.01 }], { resp: 0.28, z: 1 });
  F.bfg = colorTrack([{ t: 3.5, v: WHITE }, { t: 6.5, v: INK }, { t: 7.4, v: WHITE, resp: 0.01 }], { resp: 0.28, z: 1 });
  F.morph = track([{ t: 3.5, v: 0 }, { t: 4.0, v: 1, resp: 0.5, z: 0.9 }, { t: 6.0, v: 0, resp: 0.01 }]);

  // ── cursor (world coords). Anchored at the drag release so the loop is one continuous function ──
  const pal1 = G.pal1.h;
  const tCell = { x: tt.l + cellX(1) + TT.colW * 0.62, y: tt.t + cellY(2) + TT.cellH * 0.55 };
  F.tCell = tCell;
  const CK = [ // t, x, y, resp
    [5.62, 236, 10, 0.5], [6.6, (F.tabX[2].l + F.tabX[2].r) / 2 + 10, 12, 0.48], [7.6, (F.tabX[1].l + F.tabX[1].r) / 2 + 8, 12, 0.3],
    [8.2, tCell.x, tCell.y, 0.85], [9.86, 168, 92, 0.5], [10.5, 300, 300, 0.6], [11.0, 290, 196, 0.55],
    [12.0, 250, 108, 0.5], [13.25, 14, 12, 0.56], [14.1, 236, 98, 0.5], [15.05, 22, 98, 0.38],
    [15.62, 220, 120, 0.5], [17.2, 134, 8, 0.4], [17.6, -248, 150, 0.42], [18.08, X37 + 4, BY + 8, 0.36],
  ];
  // the cursor is one sequence that starts at the drag release and ends on the grab: continuous through the loop point
  const cx = seq(relX, CK.map(k => ({ t: k[0] - REL, v: k[1], resp: k[3] })));
  const cy = seq(BY + 8, CK.map(k => ({ t: k[0] - REL, v: k[2], resp: k[3] })));
  F.cursor = t => {
    t = mod(t);
    if (t >= GRAB && t < REL) return [F.dragX(t), BY + 8];
    const u = mod(t - REL);
    return [cx(u), cy(u)];
  };
  F.GRAB = GRAB; F.REL = REL;
  PRESS.push(0.0, 1.5, 3.5, 4.0, 6.5, 7.5, 8.0);
}

// ───────────────────────── seek(t): every style is a pure function of t ─────────────────────────
const el = { cam: $('#cam'), shape: $('#shape'), c: $('#c'), track: $('#track'), fill: $('#fill'), knob: $('#knob'),
  badge: $('#badge'), bIcon: $('#badgeIcon'), tip: $('#tip'), cursor: $('#cursor') };
const typed = (t, t0, dt, s) => s.slice(0, clamp(Math.floor((t - t0) / dt) + 1, 0, s.length) * (t >= t0 ? 1 : 0));
const P = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];

function seek(t) {
  t = mod(t);
  const w = F.w(t), h = F.h(t), r = F.r(t), s = F.cam(t);
  el.cam.style.transform = `scale(${s})`;
  const pressShape = 1 - 0.035 * press(t, [0.0, 1.5, 3.5]);
  Object.assign(el.shape.style, { left: -w / 2 + 'px', top: -h / 2 + 'px', width: w + 'px', height: h + 'px',
    borderRadius: Math.min(r, w / 2, h / 2) + 'px', background: F.bg(t), transform: `scale(${pressShape})`,
    boxShadow: '0 1px 2px rgba(20,16,10,.06), 0 18px 40px -14px rgba(20,16,10,.22)' });
  el.c.style.left = w / 2 + 'px'; el.c.style.top = h / 2 + 'px';

  // content layers: own enter/exit timing, short blur on swap
  for (const L of LAYERS) {
    const e = env(t, L.a, L.b, L.o);
    if (e.op < 0.003) { L.el.style.display = 'none'; continue; }
    let y = L.dy;
    if (L.anchor === 'top') y += -h / 2 + L.h / 2;
    if (L.anchor === 'bottom') y += h / 2 - L.h / 2;
    if (L.o.y) y += L.o.y(t);
    const sc = 0.965 + 0.035 * e.en;
    Object.assign(L.el.style, { display: 'block', opacity: e.op, filter: e.op > 0.995 ? 'none' : `blur(${((1 - e.op) * 7).toFixed(2)}px)`,
      transform: `translate(0px, ${(y + (1 - e.en) * 12 - e.ex * 8).toFixed(2)}px) scale(${sc})` });
  }

  // typing into «Логін», password as dots
  $('#fTx').textContent = typed(t, 0.5, 0.064, 'student');
  $('#fPh').style.opacity = t < 0.5 ? 1 : 0;
  const nDots = t < 1.06 ? 0 : clamp(Math.floor((t - 1.06) / 0.034) + 1, 0, 11);
  $('#cPh').style.opacity = nDots ? 0 : 1;
  const dots = $('#cDots');
  if (dots.childElementCount !== 11) dots.innerHTML = '<i></i>'.repeat(11);
  [...dots.children].forEach((d, i) => { const k = S(t - (1.06 + i * 0.034), 0.22, 0.75);
    Object.assign(d.style, { display: 'block', width: '13px', height: '13px', borderRadius: '50%', background: INK, transform: `scale(${k})`, opacity: clamp(k * 3) }); });
  $('#cBtn').style.transform = `scale(${1 - 0.04 * press(t, [1.5])})`;

  // loader & check
  $('#spinArc').style.transform = `rotate(${(t - 2.0) * 520 - 90}deg)`; $('#spinArc').style.transformOrigin = '40px 40px';
  $('#chk').style.strokeDashoffset = 1 - S(t - 2.56, 0.4, 1);

  // semester progress: value from the drag, week label from the real calendar (01.09–25.12, 17 тижнів)
  const pr = F.prog(t), v = pr.v;
  const week = clamp(Math.floor(v / 100 * 115 / 7) + 1, 1, 17);
  $('#sWeek').textContent = `${week}-й навчальний тиждень (${week % 2 ? 'Чисельник' : 'Знаменник'})`;
  $('#sPct').textContent = Math.round(v) + '%';
  const dl = v >= 91.3 ? 1 : 0;
  $('#sTick').style.background = dl ? INK : '#A1A1AA'; $('#sDl').style.color = dl ? INK : '#71717A';

  // track + fill
  const inSem = t >= 4.0 && t < 6.0;
  const tl = F.tl(t), trr = F.tr(t) + (inSem ? pr.s : 0), th = F.th(t) * (inSem ? 1 - 0.25 * pr.s / 60 : 1), ty = F.ty(t);
  const top = F.top(t);
  Object.assign(el.track.style, { display: top < 0.003 ? 'none' : 'block', left: tl + 'px', top: ty - th / 2 + 'px', width: trr - tl + 'px', height: th + 'px',
    borderRadius: th / 2 + 'px', background: F.tc(t), opacity: top });
  const kc = inSem ? F.BX0 + (F.BX1 - F.BX0) * v / 100 + pr.s : null;
  Object.assign(el.fill.style, { left: 0, top: 0, height: '100%', width: inSem ? Math.max(0, kc - tl) + 'px' : '0px', borderRadius: th / 2 + 'px', background: INK, opacity: F.fop(t) });

  // knob (two edges on two springs → the leading edge stretches ahead)
  let kxl = F.kxl(t), kxr = F.kxr(t), ky = F.ky(t), kh = F.kh(t), krr = F.kr(t);
  if (inSem) { kxl = kc - 18; kxr = kc + 18; }
  if (t >= 10.95 && t < 12.0) ky = -h / 2 + 105 + 40;
  const kop = F.kop(t);
  const kp = 1 - 0.06 * press(t, [6.5, 7.5, 8.0, 11.5]);
  Object.assign(el.knob.style, { display: kop < 0.003 ? 'none' : 'block', left: kxl + 'px', top: ky - kh / 2 + 'px', width: Math.max(0, kxr - kxl) + 'px', height: kh + 'px',
    borderRadius: Math.min(krr, kh / 2) + 'px', background: F.kc(t), opacity: kop, transform: `scale(${kp})`,
    boxShadow: t > 5.9 && t < 7.0 ? '0 2px 6px rgba(0,0,0,.18)' : (inSem ? '0 0 0 4px #fff, 0 2px 6px rgba(0,0,0,.2)' : 'none') });

  // badge with the arrow → clock morph, then moon / sun
  const bop = F.bop(t);
  if (bop < 0.003) el.badge.style.display = 'none';
  else {
    const bs = F.bs(t) * (1 - 0.06 * press(t, [4.0]));
    Object.assign(el.badge.style, { display: 'block', left: F.bx(t) - bs / 2 + 'px', top: F.by(t) - bs / 2 + 'px', width: bs + 'px', height: bs + 'px', borderRadius: '50%', background: F.bbg(t), opacity: bop });
    const isz = bs * 0.5, m = clamp(F.morph(t), 0, 1.04);
    const fg = F.bfg(t), sw = (STROKE * 24 / isz).toFixed(3);
    Object.assign(el.bIcon.style, { left: (bs - isz) / 2 + 'px', top: (bs - isz) / 2 + 'px', width: isz + 'px', height: isz + 'px' });
    el.bIcon.setAttribute('stroke', fg); el.bIcon.setAttribute('stroke-width', sw);
    const themeK = env(t, 6.0, 7.0, { din: 0.04 }), sunK = env(t, 6.5, 7.0, { din: 0.06 });
    if (t >= 5.9 && t < 7.2) {
      const moonOp = themeK.op * (1 - sunK.en), sunOp = sunK.op;
      el.bIcon.innerHTML = `<g opacity="${(1 - themeK.en) * 1}">${clockMorph(1)}</g><g opacity="${moonOp}" transform="rotate(${(1 - themeK.en) * -40} 12 12)">${LUCIDE.moon}</g><g opacity="${sunOp}" transform="rotate(${(1 - sunK.en) * 60} 12 12)">${LUCIDE.sun}</g>`;
    } else el.bIcon.innerHTML = clockMorph(m);
  }

  // timetable cells draw themselves, today highlighted, hover tooltip
  if (t > 8.4 && t < 10.3) {
    document.querySelectorAll('.cell').forEach(cel => {
      const c = +cel.dataset.c, r = +cel.dataset.r, d = 9.0 + c * 0.055 + r * 0.03 - 0.03;
      const k = S(t - d, 0.36, 0.84), hov = c === 1 && r === 2 ? S(t - 9.5, 0.2, 1) : 0;
      Object.assign(cel.style, { opacity: clamp(k * 1.4), transform: `translateY(${(1 - k) * 18}px) scale(${0.92 + 0.08 * k})`,
        filter: k > 0.99 ? 'none' : `blur(${(1 - clamp(k)) * 6}px)`, background: hov ? `rgb(${lerp(24, 39, hov)},${lerp(24, 39, hov)},${lerp(27, 42, hov)})` : '#18181B', borderColor: hov ? `rgba(255,255,255,${0.12 + 0.5 * hov})` : '#27272A' });
    });
  }
  const te = env(t, 9.5, 10.0, { din: 0.02, rin: 0.3, rout: 0.15 });
  if (te.op < 0.003) el.tip.style.display = 'none';
  else {
    const tx = F.tCell.x, tyy = F.tCell.y - TT.cellH * 0.55 - 14;
    el.tip.innerHTML = `<div style="font-size:19px;font-weight:650;white-space:nowrap">Алгоритми і методи обчислень</div><div style="margin-top:6px;font-size:16px;color:#52525B;white-space:nowrap">Лекція · 11:50 - 13:10 · навчальний-42</div>`;
    Object.assign(el.tip.style, { display: 'block', left: tx - 190 + 'px', top: tyy - 82 + 'px', width: '380px', padding: '16px 18px', borderRadius: '16px', background: WHITE, color: INK,
      boxShadow: '0 1px 2px rgba(0,0,0,.08), 0 14px 30px -10px rgba(0,0,0,.45)', opacity: te.op, transformOrigin: '50% 100%',
      transform: `translateY(${(1 - te.en) * 10}px) scale(${0.94 + 0.06 * te.en})`, filter: te.op > 0.99 ? 'none' : `blur(${(1 - te.op) * 6}px)` });
  }

  // ⌘K: the knob is the key cap; then the selection; typing «Нов»
  $('#pTx').textContent = typed(t, 10.62, 0.08, 'Нов');
  $('#pPh').style.opacity = t < 10.62 ? 1 : 0;
  $('#pCaret').style.opacity = t < 10.9 ? 1 : (mod(t, 0.5) < 0.25 ? 1 : 0);
  $('#enterKey').style.transform = `scale(${1 - 0.12 * press(t, [11.5])})`;
  $('#enterKey').style.background = press(t, [11.5]) > 0.3 ? '#E4E4E7' : SOFT;
  SEARCH.forEach((row, i) => {
    const L = LAYERS.find(l => l.id === 'lRow' + i);
    const sel = (i === 0 && t < 11.0) || (i === 1 && t >= 11.0) ? (i === 1 ? S(t - 11.0, 0.3, 1) : 1) : 0;
    const el2 = L.el, c1 = sel > 0.5 ? '#fff' : INK, c2 = sel > 0.5 ? 'rgba(255,255,255,.78)' : '#71717A';
    el2.querySelector('.rowT1').style.color = c1; el2.querySelector('.rowT2').style.color = c2;
    const icEl = el2.querySelector('.rowIc'), arEl = el2.querySelector('.rowAr');
    const want = sel > 0.5 ? 'w' : 'k';
    if (icEl.dataset.st !== want) { icEl.dataset.st = want; icEl.innerHTML = icon(icEl.dataset.ic, 30, sel > 0.5 ? '#fff' : '#3F3F46'); arEl.innerHTML = icon('arrow-right', 22, sel > 0.5 ? '#fff' : '#A1A1AA'); }
  });

  // cursor: constant size on screen, follows world positions through the camera
  const [cxw, cyw] = F.cursor(t);
  const held = t >= F.GRAB - 0.03 && t < F.REL ? 1 : 0;
  const pc = Math.max(press(t), held);
  el.cursor.style.transform = `translate(${720 + s * cxw * pressShape}px, ${720 + s * cyw * pressShape}px) scale(${1.32 * (1 - 0.14 * pc)})`;
}

// arrow-right → clock: shaft becomes the hour hand, the chevron folds into the minute hand, the dial draws
function clockMorph(m) {
  const k = clamp(m, 0, 1);
  const A = (a, b) => P(a, b, k);
  const s0 = A([5, 12], [12, 6]), s1 = A([19, 12], [12, 12]);
  const c0 = A([12, 5], [12, 12]), c1 = A([19, 12], [16, 14]), c2 = A([12, 19], [16, 14]);
  const circ = 2 * Math.PI * 10;
  return `<circle cx="12" cy="12" r="10" stroke-dasharray="${circ * k} ${circ}" transform="rotate(-90 12 12)" opacity="${k > 0.01 ? 1 : 0}"/>
    <path d="M${s0} L${s1}"/><path d="M${c0} L${c1} L${c2}"/>`;
}

  { t: 10.0, k: 'whoosh', g: 0.8 }, { t: 10.5, k: 'swish', g: 0.5 }, ...[0, 1, 2].map(i => ({ t: 10.62 + i * 0.08, k: 'key' })),
  { t: 11.0, k: 'pop', g: 0.6 }, { t: 11.5, k: 'enter' }, { t: 12.0, k: 'pop' }, { t: 12.5, k: 'swish', g: 0.5 }, { t: 13.0, k: 'swish', g: 0.6 },
];

window.ready = (async () => {
  await document.fonts.load('600 20px Geist'); await document.fonts.load('400 20px Geist'); await document.fonts.load('700 20px Geist');
  await document.fonts.ready;
  build();
  window.seek = seek;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) seek(+q.get('t'));
  else if (q.has('play')) { const t0 = performance.now(); const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); }
  else seek(0);
  return true;
})();
